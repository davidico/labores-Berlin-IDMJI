<style>
*{box-sizing:border-box}
html{color-scheme:light;-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:15px}
img{max-width:100%}
[hidden]{display:none!important}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
input:disabled{background:var(--soft);color:var(--muted);cursor:not-allowed}
.sheet{position:fixed;z-index:41;left:50%;transform:translateX(-50%);bottom:0;width:min(520px,100%);max-height:78vh;display:flex;flex-direction:column;background:var(--surface);border-radius:18px 18px 0 0;box-shadow:0 -10px 40px rgba(10,15,30,.25);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px))}
@media(min-width:700px){.sheet{bottom:auto;top:50%;transform:translate(-50%,-50%);border-radius:18px}}
.pklist{overflow:auto;margin-top:8px}
.pkh{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:12px 2px 4px}
.pk{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;font:inherit;font-size:16px;color:var(--ink);padding:12px 6px;cursor:pointer}
.pk span{flex:1}.pk small{color:var(--warn);font-size:13px}.pk.no span{color:var(--muted)}.pk.on{background:var(--soft);border-radius:8px}.pk b{color:var(--ok)}
.pk.clear{color:var(--warn);font-weight:600}
.fich{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;margin-top:8px}
.fich .fl{font-size:14px;color:var(--muted);font-weight:600}
.fich .fc{display:flex;align-items:center;gap:8px;min-width:0}.fich .fc .pdfl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
input.ed{width:100%;border:1px solid transparent;background:transparent;border-radius:8px;padding:4px 6px;margin:2px 0 2px -7px;font:inherit;font-size:16px;color:var(--ink)}
input.ed.b{font-weight:700}
input.ed:hover{border-color:var(--line)}input.ed:focus{border-color:var(--navy);background:var(--surface);outline:none}
input.ed::placeholder{color:var(--muted);font-weight:400}
.nrow{display:flex;align-items:center;gap:6px;min-width:0}.nrow .pdfl{flex:none;max-width:none}.nrow>b,.nrow>small{min-width:0}
.pen{border:0;background:none;color:var(--muted);padding:6px;border-radius:8px;cursor:pointer;display:inline-flex;flex:none}.pen:hover{background:var(--soft);color:var(--navy)}
input.bad{border-color:var(--warn)!important}
/* Accesibilidad: texto base 16px y áreas táctiles de al menos 40–44px */
.btn{min-height:44px}.btn.sm{min-height:40px}
.x{min-width:40px;min-height:40px}
.f{min-height:38px}
.ib{width:42px;height:42px}
.pen{min-width:40px;min-height:40px;justify-content:center}
.linkbtn{min-height:40px}
.tabs button{min-height:56px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:15px;color:var(--ink);font-weight:500;line-height:1.4}.chk input{width:22px;height:22px;flex:none;margin-top:1px}
.sheet.doc{max-height:92vh}.privtxt h2{font-size:22px;margin-top:4px}.privtxt h3{margin-top:18px}.privtxt p,.privtxt li{font-size:15px;line-height:1.5}.privtxt ul{padding-left:20px}
.pdfl.lnk{text-decoration:none}.pdfl.lnk::before{content:"LINK";background:var(--navy)}
.hdr{display:flex;align-items:center;gap:6px}
.hb{position:relative;display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface);border-radius:999px;height:42px;min-width:42px;justify-content:center;padding:0 6px;cursor:pointer;color:var(--ink)}
.hb svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hb .dots{width:18px;height:18px;fill:currentColor;stroke:none}
.hb.menu{padding:0 4px 0 5px}
.hbd{position:absolute;top:-4px;right:-4px;background:var(--warn);color:#fff;font-size:12px;font-weight:700;border-radius:999px;min-width:18px;line-height:18px;text-align:center;padding:0 4px;border:2px solid var(--bg)}
.ava{border-radius:50%;object-fit:cover;flex:none;display:inline-block}
.ava.ini{display:inline-flex;align-items:center;justify-content:center;background:var(--navy);color:var(--on-navy);font-weight:700;font-family:var(--display)}
.scrim{position:fixed;inset:0;background:rgba(10,15,30,.28);z-index:40}
.pop{position:fixed;z-index:41;right:max(12px,calc(50% - 360px));top:calc(env(safe-area-inset-top,0px) + 64px);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 14px 40px rgba(10,15,30,.25);padding:10px}
.menu-pop{width:240px}.menu-pop>button{display:block;width:100%;text-align:left;border:0;background:none;font:inherit;font-size:16px;color:var(--ink);padding:12px 10px;border-radius:10px;cursor:pointer}.menu-pop>button:hover{background:var(--soft)}
.pophead{display:flex;gap:10px;align-items:center;padding:6px 8px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}.pophead small{display:block;color:var(--muted);font-size:13px;word-break:break-all}
.bell-pop{width:min(380px,calc(100vw - 24px));max-height:70vh;display:flex;flex-direction:column;padding:12px 14px}.bell-list{overflow:auto;margin-top:6px}
.viewas{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--sky);border:1px solid var(--sky-line);border-radius:12px;padding:8px 12px;margin-bottom:12px;font-size:15px}
.phrow{display:flex;align-items:center;gap:16px}
.ver{text-align:center;color:var(--muted);font-size:14px;margin:22px 0 8px}
.mfold{display:flex;width:100%;justify-content:space-between;align-items:center;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font:inherit;font-size:16px;padding:12px 2px;cursor:pointer;text-align:left}.mfold .chev{color:var(--muted);font-size:16px}
.authbox{max-width:420px;margin:0 auto}
.authlogo{display:block;margin:8px auto 0;border-radius:16px;box-shadow:0 6px 18px rgba(20,29,51,.18)}
.linkbtn{border:0;background:none;padding:4px 2px;font:inherit;font-size:16px;font-weight:600;color:var(--navy);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.authalt{text-align:center;margin-top:16px;color:var(--muted)}
.authsep{display:flex;align-items:center;gap:10px;margin:22px 0 12px;color:var(--muted);font-size:14px}.authsep:before,.authsep:after{content:"";flex:1;height:1px;background:var(--line)}
.authtag{display:inline-block;background:var(--gold);color:#1a1404;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;margin-top:6px}
.steps{margin:6px 0 14px;padding-left:20px;color:var(--muted);line-height:1.5}.steps li{margin:4px 0}
.card.signup{border-top:4px solid var(--gold)}
.pwrap{position:relative;display:block}.pwrap input{padding-right:78px}.pweye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--navy);font:inherit;font-weight:600;font-size:15px;padding:8px 10px;cursor:pointer}
</style>
<style>
/* Layout: app de una columna para el celular, tarjetas por día, barra de pestañas abajo */
:root{
  --bg:#f2f4f8; --surface:#ffffff; --ink:#141d33; --muted:#5a6377; --line:#dde2eb;
  --navy:#1d2c66; --on-navy:#ffffff; --gold:#b8921c; --soft:#e6eaf6;
  --warn:#b0501a; --warn-soft:#fbede3; --ok:#1f7a4a; --on-ok:#ffffff; --sky:#e3e8f7; --sky-line:#b4bfe3;
  --a-pul:#1d2c66; --a-puer:#6d4593; --a-son:#16716f; --a-trad:#a5620e; --a-ofr:#943548; --a-mic:#4a6519;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1322; --surface:#151d31; --ink:#e6eaf4; --muted:#9aa3b8; --line:#273049;
  --navy:#a9b8ff; --on-navy:#0d1322; --gold:#dfbe55; --soft:#1d2846;
  --warn:#f2a273; --warn-soft:#3a2417; --ok:#6fd39a; --on-ok:#0d1322; --sky:#1f2a4d; --sky-line:#3a4a85;
  --a-pul:#a9b8ff; --a-puer:#c8a4ea; --a-son:#6fd3cf; --a-trad:#f0b45e; --a-ofr:#f095a8; --a-mic:#b3d27a;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1322; --surface:#151d31; --ink:#e6eaf4; --muted:#9aa3b8; --line:#273049;
  --navy:#a9b8ff; --on-navy:#0d1322; --gold:#dfbe55; --soft:#1d2846;
  --warn:#f2a273; --warn-soft:#3a2417; --ok:#6fd39a; --on-ok:#0d1322; --sky:#1f2a4d; --sky-line:#3a4a85;
  --a-pul:#a9b8ff; --a-puer:#c8a4ea; --a-son:#6fd3cf; --a-trad:#f0b45e; --a-ofr:#f095a8; --a-mic:#b3d27a;
  color-scheme:dark}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 120px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 12px}
.brand{font-family:var(--display);font-size:21px;font-weight:700;color:var(--navy);line-height:1.1}
.brand small{display:block;font-family:var(--body);font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.09em;text-transform:uppercase;margin-top:3px}
.who{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font:inherit;font-size:14px;color:var(--ink);cursor:pointer;white-space:nowrap}
.banner{font-size:15px;color:var(--muted);background:var(--soft);border-radius:10px;padding:8px 12px;margin-bottom:14px}
h2{font-family:var(--display);font-size:25px;font-weight:700;margin:6px 0 4px;text-wrap:balance;line-height:1.15}
.lead{color:var(--muted);margin:0 0 14px;font-size:15px}
h3{font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px;font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.list{display:flex;flex-direction:column;gap:10px}
.mine{display:grid;grid-template-columns:52px 1fr;gap:14px;align-items:start}
.dbox{text-align:center;padding-right:12px;border-right:2px solid var(--gold)}
.dbox b{display:block;font-family:var(--display);font-size:26px;line-height:1;color:var(--navy);font-variant-numeric:tabular-nums}
.dbox span{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.svc{font-weight:700}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;padding:3px 10px;border-radius:999px;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c)}
.note{font-size:15px;color:var(--muted);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.note b{color:var(--ink);font-weight:600}
.note a{color:var(--navy);font-weight:600;word-break:break-all}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.dayhead .t{font-family:var(--display);font-weight:700;font-size:17px}
.dayhead .s{font-size:14px;color:var(--muted)}
.info{font-size:14px;color:var(--muted);margin-top:2px}
.info b{color:var(--ink);font-weight:600}
.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.04em;padding:2px 8px;border-radius:6px;background:var(--warn-soft);color:var(--warn);margin-left:4px}
.tag.gold{background:color-mix(in srgb,var(--gold) 18%,transparent);color:var(--ink)}
.rows{margin-top:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line);min-width:0}
.row .lbl{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:8px;min-width:0}
.dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--c)}
.pick{font:inherit;font-weight:600;background:none;border:none;color:var(--ink);padding:3px 0;text-align:right;cursor:pointer;border-bottom:1px dashed var(--line);min-width:0}
.pick.empty{color:var(--warn)}
.warn{display:block;font-size:13px;color:var(--warn);font-weight:600;text-align:right}
.fixedn{font-weight:600;text-align:right;font-size:15px}
.week{font-family:var(--display);font-weight:700;font-size:16px;color:var(--navy);margin:20px 0 8px;display:flex;gap:8px;align-items:baseline}
.week span{font-family:var(--body);font-weight:500;font-size:14px;color:var(--muted)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.mnav{display:flex;align-items:center;gap:6px}
.mnav b{font-family:var(--display);font-size:19px;min-width:130px;text-align:center;text-transform:capitalize}
.ib{font:inherit;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-size:17px}
.filters{display:flex;gap:6px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}
.f{font:inherit;font-size:14px;font-weight:600;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:6px 12px;white-space:nowrap;cursor:pointer}
.f[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.btn{font:inherit;font-weight:600;font-size:15px;border-radius:10px;padding:9px 14px;border:1px solid var(--navy);background:var(--navy);color:var(--on-navy);cursor:pointer}
.btn.ghost{background:transparent;color:var(--navy)}
.btn.warnb{background:var(--warn);border-color:var(--warn);color:var(--surface)}
.btn.sm{padding:6px 10px;font-size:15px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--warn-soft);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:15px}
.pre{white-space:pre-wrap;word-break:break-word}
textarea{font:inherit;font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);width:100%;resize:vertical;box-sizing:border-box}
input,select{font:inherit;font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);min-width:0;max-width:100%}
select.cell{max-width:62%}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;font-size:14px;color:var(--muted);font-weight:600}
.inline{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.inline input[type=text],.inline input[type=url]{flex:1 1 160px}
.togs{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.tog{font:inherit;font-size:14px;font-weight:700;border-radius:10px;border:1px solid var(--sky-line);background:var(--sky);color:var(--muted);padding:10px 0 9px;cursor:pointer;box-shadow:0 3px 0 var(--sky-line);transform:translateY(0);transition:transform .08s,box-shadow .08s}
.tog[aria-pressed="true"]{color:var(--ink);border-color:color-mix(in srgb,var(--ink) 30%,var(--sky-line));box-shadow:inset 0 3px 6px color-mix(in srgb,var(--ink) 28%,transparent);transform:translateY(3px)}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:none}
.li .main{min-width:0;flex:1}
.li .main small{display:block;color:var(--muted);font-size:14px}
.x{font:inherit;border:none;background:none;color:var(--muted);cursor:pointer;font-size:16px;padding:4px 6px;border-radius:6px}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 12px;margin:6px 0 10px}
.checks label{display:flex;gap:8px;align-items:center;font-size:15px;color:var(--ink);font-weight:500}
.pbtn{font:inherit;text-align:left;width:100%;background:none;border:none;color:var(--ink);cursor:pointer;padding:0}
.pbtn b{font-weight:700}
.empty-state{text-align:center;color:var(--muted);padding:28px 16px}
.login{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.login button{font:inherit;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--ink);cursor:pointer;font-weight:600}
.login button small{display:block;font-weight:500;color:var(--muted);font-size:13px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px));z-index:5}
.tabs button{flex:1;max-width:120px;min-width:0;font:inherit;font-size:12px;font-weight:600;background:none;border:none;color:var(--muted);padding:12px 2px 13px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}

.tabs button[aria-current="page"]{color:var(--navy);box-shadow:inset 0 3px 0 var(--gold)}
.banner.warnbn{background:var(--warn-soft);color:var(--warn)}
.wrap.wide{max-width:1440px}
.grids{display:grid;gap:0 22px}
/* Las tablas del horario van una debajo de otra (no lado a lado) */
.gblock{min-width:0}
.acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.panel{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--soft)}
.pl{margin:6px 0 10px;padding-left:18px;font-size:15px}
.card.ask{border-color:var(--gold);box-shadow:0 0 0 1px color-mix(in srgb,var(--gold) 40%,transparent)}
.li.unread .main{font-weight:600}
.li.unread .main::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--warn);margin-right:6px;vertical-align:1px}
.banner.ok{background:color-mix(in srgb,var(--a-son) 16%,transparent);color:var(--ink)}
.tabs button{position:relative}
.bdg{position:absolute;top:5px;left:calc(50% + 6px);background:var(--warn);color:var(--surface);font-size:12px;font-weight:700;border-radius:999px;padding:0 5px;line-height:16px;min-width:16px;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}

.cd{font:inherit;min-height:64px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 4px;display:flex;flex-direction:column;gap:3px;align-items:stretch;cursor:pointer;color:var(--ink);text-align:left;min-width:0}

.cd .more{font-size:12px;color:var(--muted);font-weight:700}
.nt{width:6px;height:6px;border-radius:50%;background:var(--gold);display:inline-block}
.gn{font-size:14px}
.sw{display:flex;align-items:center;gap:10px;background:none;border:none;font:inherit;cursor:pointer;padding:4px 0;color:var(--muted);font-weight:600;font-size:15px}
